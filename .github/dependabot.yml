version: 2

# P3-9 (2026-05-22 audit): dependabot keeps the SHA pins added in
# Phase 7 fresh. Hand-pinning actions stops mutable tags from being
# silently rewritten under us; dependabot keeps the pins from rotting
# without an operator having to chase every action release manually.
#
# Every entry carries the 7-day supply-chain cooldown from CLAUDE.md, so a
# version-update PR never proposes a release younger than the rule allows
# (check-action-pins.sh and bunfig.toml enforce the same window in CI and at
# install). Dependabot does not apply cooldown to security updates; a
# security fix inside the window still needs an explicit user override.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(actions)
    labels:
      - dependencies
      - github-actions
    # Group every action bump into one weekly PR so the cooldown
    # review happens in one place rather than across N parallel PRs.
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(backend)
    labels:
      - dependencies
      - go
    # Hold k8s.io/* together — bumping them piecemeal usually breaks
    # the build because client-go pins apimachinery and friends.
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
      golang-x:
        patterns:
          - "golang.org/x/*"

  # The frontend is managed by Bun (bun.lock). Without this entry,
  # Dependabot's security updates fall back to npm_and_yarn, which cannot
  # update bun.lock and fails the job.
  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(frontend)
    labels:
      - dependencies
      - frontend

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(docker)
    labels:
      - dependencies
      - docker

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(docker)
    labels:
      - dependencies
      - docker
