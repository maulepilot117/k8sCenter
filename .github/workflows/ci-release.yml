name: CI Release

on:
  push:
    branches: [main]

# Deny by default — each job declares minimum permissions
permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
            code:
              - 'backend/**'
              - 'frontend/**'

  version-tag:
    name: Version Tag
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: write
    # `backend` / `frontend` say which images this run builds. They start
    # from the paths filter and drop any component a newer release already
    # rebuilt (see the step below). The image and release jobs read these,
    # not the `changes` outputs, so a superseded run builds only what no
    # newer release covers.
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      backend: ${{ steps.resolve.outputs.backend }}
      frontend: ${{ steps.resolve.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Resolve and push in one step so a lost race can be retried.
      # Merges landing seconds apart start concurrent runs that see the
      # same tag set and pick the same next tag; the remote rejects the
      # second push because tags are never force-pushed here. On that
      # rejection, refresh the tags and try again. A `concurrency:` group
      # is not used: GitHub keeps one pending run per group and cancels
      # the rest, which would skip their image builds.
      #
      # A retry must not hand an older commit a higher version than a
      # newer one, or the highest image tag would carry older code. So
      # before claiming a number, find releases on newer commits that
      # already contain this one. Each such commit's run rebuilt the
      # components its own commit touched (one commit per push: main is
      # squash-merged), from a tree that includes this change, so this
      # run drops those components. If nothing is left, it is fully
      # superseded: no tag, no images, no release. Otherwise it builds
      # the rest under the next number, and for each of those components
      # that image is still the newest code. The check runs on every
      # attempt, so it also covers a run that starts late.
      - name: Resolve and create version tag
        id: resolve
        env:
          CHANGED_BACKEND: ${{ needs.changes.outputs.backend }}
          CHANGED_FRONTEND: ${{ needs.changes.outputs.frontend }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Read appVersion from Chart.yaml
          CHART_VERSION=$(grep '^appVersion:' helm/kubecenter/Chart.yaml | sed 's/appVersion: *"\?\([^"]*\)"\?/\1/')
          echo "Chart appVersion: ${CHART_VERSION}"

          HEAD_SHA=$(git rev-parse HEAD)
          BUILD_BACKEND="${CHANGED_BACKEND}"
          BUILD_FRONTEND="${CHANGED_FRONTEND}"

          MAX_ATTEMPTS=10
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            git fetch --quiet --force --tags origin

            # Tags on this same commit (a re-run) do not supersede it.
            for newer in $(git tag -l 'v*' --contains "$HEAD_SHA"); do
              NEWER_SHA=$(git rev-parse "${newer}^{commit}")
              [ "$NEWER_SHA" = "$HEAD_SHA" ] && continue
              if ! git diff --quiet "${NEWER_SHA}^" "$NEWER_SHA" -- backend/; then
                [ "$BUILD_BACKEND" = "true" ] && echo "Backend image is covered by ${newer}"
                BUILD_BACKEND=false
              fi
              if ! git diff --quiet "${NEWER_SHA}^" "$NEWER_SHA" -- frontend/; then
                [ "$BUILD_FRONTEND" = "true" ] && echo "Frontend image is covered by ${newer}"
                BUILD_FRONTEND=false
              fi
            done
            if [ "$BUILD_BACKEND" != "true" ] && [ "$BUILD_FRONTEND" != "true" ]; then
              echo "::notice::Superseded: newer releases already contain this commit and rebuilt every image it changed. No tag, images or release."
              {
                echo "version="
                echo "tag="
                echo "backend=false"
                echo "frontend=false"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if git rev-parse -q --verify "refs/tags/v${CHART_VERSION}" >/dev/null; then
              LATEST=$(git for-each-ref --count=1 --sort=-version:refname --format='%(refname:short)' 'refs/tags/v*')
              if [ -z "$LATEST" ]; then
                LATEST="v0.0.0"
              fi
              MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
              MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
              PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            else
              VERSION="${CHART_VERSION}"
            fi
            TAG="v${VERSION}"

            git tag "$TAG"
            PUSHED=false
            if git push origin "refs/tags/${TAG}"; then
              PUSHED=true
            else
              git tag -d "$TAG" >/dev/null
              # The push can fail after the remote stored the tag (the
              # connection dropped before the reply). A remote tag on this
              # commit is that push, not another run's.
              REMOTE_SHA=$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1) || REMOTE_SHA=""
              if [ "$REMOTE_SHA" = "$HEAD_SHA" ]; then
                PUSHED=true
              elif [ -z "$REMOTE_SHA" ]; then
                # Retry only when another run took the tag. Any other push
                # failure (auth, network) is real and fails the job.
                echo "::error::Pushing ${TAG} failed and the tag does not exist on the remote"
                exit 1
              fi
            fi
            if [ "$PUSHED" = "true" ]; then
              {
                echo "version=${VERSION}"
                echo "tag=${TAG}"
                echo "backend=${BUILD_BACKEND}"
                echo "frontend=${BUILD_FRONTEND}"
              } >> "$GITHUB_OUTPUT"
              echo "Release version: ${TAG} (backend image: ${BUILD_BACKEND}, frontend image: ${BUILD_FRONTEND})"
              exit 0
            fi
            echo "::warning::${TAG} was claimed by a concurrent run (attempt ${attempt}/${MAX_ATTEMPTS}); retrying"
            sleep $((attempt + RANDOM % 3))
          done

          echo "::error::Could not claim a free version tag after ${MAX_ATTEMPTS} attempts"
          exit 1

  build-backend-image:
    name: Build Backend Release Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    needs: [version-tag]
    if: needs.version-tag.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "commit=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: k8scenter-backend:scan
          build-args: |
            VERSION=${{ needs.version-tag.outputs.tag }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=backend

      - name: Scan backend image with Trivy
        # P3-9 (2026-05-22 audit): release scans gate the build. The
        # combination of severity=CRITICAL,HIGH + ignore-unfixed=true +
        # exit-code=1 fails the workflow on any fixable critical/high
        # CVE while leaving unfixable advisories surfaced as SARIF
        # without blocking. Accepted residual findings belong in
        # .trivyignore (created on demand when the first allowlisted
        # CVE shows up) — the audit's "reviewed allowlists" guidance.
        #
        # limit-severities-for-sarif=true is REQUIRED: without it the
        # action builds the SARIF report with ALL severities, which also
        # drops the severity filter for exit-code — so the build would
        # fail on fixable LOW/MEDIUM CVEs, not just CRITICAL/HIGH,
        # contradicting the policy above. With it, both the SARIF and the
        # exit-code honour severity=CRITICAL,HIGH.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: k8scenter-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ".trivyignore"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      - name: Build & push backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/k8scenter-backend:${{ needs.version-tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/k8scenter-backend:sha-${{ steps.meta.outputs.commit }}
            ghcr.io/${{ github.repository_owner }}/k8scenter-backend:latest
          build-args: |
            VERSION=${{ needs.version-tag.outputs.tag }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api users/${{ github.repository_owner }}/packages/container/k8scenter-backend \
            --method PATCH --field visibility=public || true

  build-frontend-image:
    name: Build Frontend Release Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    needs: [version-tag]
    if: needs.version-tag.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "commit=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build amd64 image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: k8scenter-frontend:scan
          cache-from: type=gha,scope=frontend

      - name: Scan frontend image with Trivy
        # P3-9 (2026-05-22 audit): release scans gate the build. See
        # the matching backend-image step above for the policy detail.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: k8scenter-frontend:scan
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ".trivyignore"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      # The image scan above covers OS packages ONLY. Measured during U10:
      # `trivy image` reports zero language-specific files for this image and
      # never reads /app/bun.lock -- and it never read /app/deno.lock out of
      # the Deno image this one replaces either, so the frontend's npm tree has
      # not actually been scanned by anything. `trivy fs` on the same lockfile
      # parses it correctly, so this is the step that makes that half of the
      # gate real. See docs/solutions/frontend-bun-image.md.
      - name: Scan frontend dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: frontend/bun.lock
          format: sarif
          output: trivy-frontend-deps.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: ".trivyignore"

      # A scan that finds no packages reports no findings and exits zero, which
      # is precisely how the image scan has been passing while proving nothing.
      # Re-run as JSON so the next step can assert the package set is non-empty
      # and this one cannot do the same. exit-code 0 here: the step above is
      # what gates on CVEs; this pass exists only to produce the inventory.
      - name: Re-scan the lockfile as JSON for the inventory assertion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: frontend/bun.lock
          format: json
          output: trivy-frontend-deps.json
          list-all-pkgs: true
          exit-code: "0"

      - name: Assert the dependency scan read a non-empty package set
        run: |
          set -euo pipefail
          COUNT=$(jq '[.Results[]?.Packages // [] | length] | add // 0' trivy-frontend-deps.json)
          echo "packages read from frontend/bun.lock: ${COUNT}"
          if [ "${COUNT}" -lt 20 ]; then
            echo "ERROR: the lockfile scan found ${COUNT} packages." >&2
            echo "  Either bun.lock stopped being parseable (check it is the text" >&2
            echo "  lockfile, not bun.lockb) or the pinned Trivy dropped bun support." >&2
            echo "  A scan of nothing is a failure, not a pass." >&2
            exit 1
          fi

      - name: Upload dependency Trivy SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: trivy-frontend-deps.sarif
          category: trivy-frontend-deps

      - name: Build & push frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/k8scenter-frontend:${{ needs.version-tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/k8scenter-frontend:sha-${{ steps.meta.outputs.commit }}
            ghcr.io/${{ github.repository_owner }}/k8scenter-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Set package visibility to public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api users/${{ github.repository_owner }}/packages/container/k8scenter-frontend \
            --method PATCH --field visibility=public || true

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [version-tag, build-backend-image, build-frontend-image]
    if: |
      always() &&
      needs.version-tag.result == 'success' &&
      needs.version-tag.outputs.tag != '' &&
      !contains(needs.*.result, 'failure')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.version-tag.outputs.tag }}" \
            --title "${{ needs.version-tag.outputs.tag }}" \
            --generate-notes
