name: CI

# Every pull request, not only the ones targeting `main`.
#
# A stacked series -- feature branches whose PRs target each other, with only
# the base PR pointing at `main` -- left every PR but the base with NO checks
# at all until it was retargeted after its parent merged. That is the worst
# time to learn something is broken: the parent is already in, so the failure
# lands on `main`'s doorstep rather than in review. Release G / P5 shipped as
# four stacked PRs and hit exactly this -- a mandatory-parameter rule landed
# on the base and broke three PostgreSQL-backed tests that only the base PR's
# CI could see.
#
# E2E deliberately keeps its `branches: [main]` filter: it stands up a kind
# cluster for 8 minutes, and paying that on every push to every PR in a stack
# buys far less than this workflow does.
on:
  pull_request:

# Deny by default — each job declares minimum permissions
permissions: {}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            helm:
              - 'helm/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    defaults:
      run:
        working-directory: backend

    # Throwaway PostgreSQL for the env-gated store tests (see
    # backend/internal/store/testdb_test.go). Mirrors the e2e.yml service so
    # both workflows exercise the same image + credential shape.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: k8scenter
          POSTGRES_PASSWORD: k8scenter
          POSTGRES_DB: k8scenter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U k8scenter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # P2-11 (2026-05-22 audit): pin to 1.26.3 to clear the
          # reachable govulncheck advisories landed in stdlib at that
          # patch — staying on the "1.26" floating prefix would lag
          # the security patch on CI runners cached from an earlier
          # minor.
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum

      - name: Check cluster-routing discipline
        # P2-5: fail any handler that calls .ClientForUser / .DynamicClientForUser
        # directly instead of routing through ClusterRouter.
        # warn mode during Phase 2 soak — flip to "fail" in a follow-up PR.
        working-directory: ${{ github.workspace }}
        env:
          CHECK_CLUSTER_ROUTING_GATE: warn  # flip to "fail" after Phase 2 rewrites land
        run: bash scripts/check-cluster-routing.sh

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          # Enables the PostgreSQL-backed store tests, which t.Skip when
          # this is unset. Deliberately NOT KUBECENTER_DATABASE_URL — the
          # harness refuses to fall back to the runtime variable.
          KUBECENTER_TEST_DATABASE_URL: "postgresql://k8scenter:k8scenter@localhost:5432/k8scenter?sslmode=disable"
          # Turns a skip into a hard failure. Without this, dropping or
          # renaming the URL above would make every PostgreSQL-backed test
          # skip silently while CI stayed green — the exact failure this
          # harness exists to prevent.
          KUBECENTER_TEST_REQUIRE_DATABASE: "1"
        run: go test ./... -race -cover -count=1

      - name: Build
        run: go build -o /dev/null ./cmd/kubecenter

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # .bun-version is the single source of truth for the runtime version
          # (R9); pinning it here too would let CI and local drift apart.
          bun-version-file: .bun-version

      - name: Install dependencies
        # --frozen-lockfile so a lockfile that does not match package.json
        # fails here rather than being silently rewritten in CI.
        run: bun install --frozen-lockfile

      # One command covers what four separate steps used to: Biome lint and
      # format, `astro check` types, and the repo's own build-time guards
      # (no /ws proxy in the dev config, no signal store on an SSR path, every
      # island call site carries a client:* directive, the lockfile is the
      # text one). See frontend/package.json.
      - name: Check
        run: bun run check

      # New in the Bun port: the frontend has a real unit suite now, and
      # nothing in CI ran it before.
      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  rbac-guard:
    name: ClusterRole CRD grants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes]
    # Run when either side of the contract moves: a backend change can add a
    # new SA-listed CRD group, and a helm change can drop a grant. Either alone
    # can reintroduce the #305 -> #326 regression.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check ClusterRole covers service-account-listed CRD groups
        # Fails if a CRD-discovered feature lists resources as the service
        # account (BaseDynamicClient) but the Helm ClusterRole is missing the
        # matching apiGroup grant — which makes the feature dashboard 500
        # wherever those CRDs are installed (root cause of #326).
        run: bash scripts/check-clusterrole-crd-grants.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run actionlint
        # actionlint catches workflow YAML syntax errors and
        # expression-language mistakes (typos in needs.<job>.outputs,
        # unknown contexts, etc.) before push-to-main. Runs on every
        # PR — not gated on path filters since workflow changes can
        # land in any PR.
        #
        # P3-9 (2026-05-22 audit): pin the download script to the
        # rhysd/actionlint v1.7.5 commit SHA rather than reading it
        # from the floating `main` branch — a malicious push to main
        # of that repo would otherwise execute arbitrary code under
        # GITHUB_TOKEN. The script then installs actionlint 1.7.5
        # itself, which is a separate signed release.
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/e11169d0656294827d65370a3c76a2325406da85/scripts/download-actionlint.bash) 1.7.5
          ./actionlint -color

      - name: Check action pins
        # Every third-party action must be pinned to a full commit SHA and be
        # at least 7 days old. Both rules existed before; neither was enforced,
        # which is the same gap KTD7 closed for Bun dependencies by moving the
        # cooldown into bunfig.toml. A rule whose only backstop is a sentence
        # in CLAUDE.md is one a PR can pass having silently skipped.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-action-pins.sh

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [changes]
    if: needs.changes.outputs.helm == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.16.2"

      - name: helm lint
        run: helm lint helm/kubecenter

      # Add subchart repos before `helm dependency build` (the OCI
      # bitnamicharts registry doesn't need an explicit `repo add`).
      - name: helm repo add
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      # Render the chart with Universal Link wiring enabled so the
      # well-known.yaml template's fail-fast guards and resource
      # outputs are exercised. helm dependency build pulls subcharts
      # so template render doesn't fail on missing deps.
      - name: helm dependency build
        run: helm dependency build helm/kubecenter

      - name: helm template — Universal Links enabled
        run: |
          helm template kubecenter helm/kubecenter \
            --set mobile.universalLinkDomain=test.example.com \
            --set mobile.iosTeamId=ABCDE12345 \
            --set mobile.androidSha256CertFingerprint=AB:CD:EF \
            --set ingress.enabled=true \
            --set 'ingress.tls[0].secretName=kubecenter-tls' \
            --set 'ingress.tls[0].hosts[0]=test.example.com' \
            > /dev/null

      # Default render (Universal Links disabled) must also succeed —
      # well-known.yaml should emit nothing in this branch.
      - name: helm template — defaults
        run: helm template kubecenter helm/kubecenter > /dev/null
