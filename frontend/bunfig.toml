# Machine-enforced supply-chain cooldown (CLAUDE.md, KTD7). Bun refuses to
# install any package published less than 7 days ago. This does not replace
# the out-of-band lockfile-age audit -- Bun issue #30525 reports the gate
# being bypassed for versions already resident in bun.lock -- it only closes
# the "install something brand new" hole.
[install]
minimumReleaseAge = 604800 # 7 days, in seconds
# User-approved exceptions for the React runtime switch (2026-11-09): these
# exact releases were under 7 days old on install day. Each passed an npm
# provenance check (built from withastro/astro or vitejs/vite main by GitHub
# Actions trusted publishing) and is pinned exactly in package.json
# (@astrojs/internal-helpers through overrides). Remove the list once every
# entry is past the cooldown.
minimumReleaseAgeExcludes = ["@astrojs/react", "@astrojs/internal-helpers", "vite"]

# Loads react-dom once, with a document present, before any test file runs.
# It registers happy-dom only for that load and removes it again; see the
# module for why.
[test]
preload = ["./src/test-utils/react-dom-env.ts"]
